<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página principal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <span class="logotipo"><a href="index.html">MyBooklog</a></span>
        <nav>
            <ul class="nav-links">
                <li><a href="estante.html">Estante</a></li>
                <li><a href="favoritos.html">Favoritos</a></li>
                <li><a href="desejos.html">Wishlist</a></li>
                <li><a href="recomendacoes.html">Recomendações</a></li>
                <li><a href="busca.html">Buscar</a></li>
                <button id="toggle-tema">🌙</button>
            </ul>
            
        </nav>
        
    </header>

    <main>

        <section class="hero">

            <h1>
                Organize sua jornada de leitura
            </h1>

            <p>
                Busque livros, favorite obras
                e acompanhe suas leituras.
            </p>

            <a href="busca.html">
                <button>
                    Buscar livros
                </button>
            </a>

        </section>

        <section class="dashboard">

            <div class="card-dashboard">

                <h2>Favoritos</h2>

                <p id="total-favoritos">
                    0
                </p>

            </div>

            <div class="card-dashboard">

                <h2>Wishlist</h2>

                <p id="total-wishlist">
                    0
                </p>

            </div>

            <div class="card-dashboard">

                <h2>Em leitura</h2>

                <p id="total-lendo">
                    0
                </p>

            </div>

            <div class="card-dashboard">

                <h2>Finalizados</h2>

                <p id="total-finalizados">
                    0
                </p>

            </div>

        </section>

        <section class="continuar-leitura">

            <h2>
                Continue lendo
            </h2>

            <div id="livro-atual"></div>

        </section>

        <section class="ultimos-adicionados">

            <h2>
                Últimos adicionados
            </h2>

            <div id="ultimos-livros"></div>

        </section>

    </main>

    <script src="js/index.js"></script>
    <script src="js/tema.js"></script>
</body>
</html>
